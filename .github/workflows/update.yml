name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 0 * * *'     # UTC 00:00 = KST 09:00, 매일 실행
  workflow_dispatch:          # 수동 실행 허용
  push:
    paths:
      - 'update_data.py'      # update_data.py 변경 시 자동 실행
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install finance-datareader yfinance requests

      - name: Run update script
        run: python update_data.py

      - name: Commit and push data files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add stocks.json us_stocks.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update stock data $(date +'%Y-%m-%d %H:%M UTC')"
          # 동시 실행 / 다른 커밋과의 충돌 방지: 최대 5회 재시도 with rebase
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push OK (attempt $i)"; exit 0
            fi
            echo "Push failed (attempt $i) — rebasing on latest origin/main"
            git pull --rebase origin main || true
            sleep $((i * 3))
          done
          echo "Push failed after 5 attempts"; exit 1
